# Production stack: the game server behind Caddy (automatic HTTPS from Let's Encrypt).
# Usage on the server:  cd /opt/ludolux && docker compose up -d --build
services:
  ludolux:
    build: { context: .., dockerfile: deploy/Dockerfile }
    restart: unless-stopped
    env_file: .env
    environment:
      # Behind Caddy: each player's own address comes from the header Caddy sets (used for rate limits and ad areas).
      TRUST_PROXY: "1"
      GEO_DB: /data/geo/dbip-city-lite.mmdb
    volumes:
      - ./data:/data
      - ./secrets:/secrets:ro
    # Not on the internet: Caddy talks to it inside Docker, and you reach it on the server itself only
    # (the ads review page and metrics, through an SSH tunnel).
    expose: ["8080"]
    ports: ["127.0.0.1:8080:8080"]
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    mem_limit: 1500m

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    env_file: .env
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy-data:/data
      - ./caddy-config:/config
    depends_on: [ludolux]
