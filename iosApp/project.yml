# The iPhone / iPad app. Generate the Xcode project on a Mac with:  ./iosApp/run.sh  (or: cd iosApp && xcodegen)
name: LudoLux
options:
  bundleIdPrefix: com.ludolux
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    # Your Apple team id (Xcode > Settings > Accounts), needed only to run on a real iPhone or upload to TestFlight.
    DEVELOPMENT_TEAM: ""
targets:
  LudoLux:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    settings:
      base:
        PRODUCT_NAME: LudoLux
        PRODUCT_BUNDLE_IDENTIFIER: com.ludolux.app
        MARKETING_VERSION: "0.3.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: iosApp/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        # The Kotlin game, built by Gradle into a framework before Swift compiles.
        FRAMEWORK_SEARCH_PATHS: ["$(inherited)", "$(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"]
        OTHER_LDFLAGS: ["$(inherited)", "-framework", "ComposeApp"]
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_VERSION: "5.0"
    preBuildScripts:
      - name: Build the Kotlin game (Gradle)
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          if [ -z "$JAVA_HOME" ] && [ -x /usr/libexec/java_home ]; then export JAVA_HOME="$(/usr/libexec/java_home -v 17 2>/dev/null || /usr/libexec/java_home)"; fi
          bash ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode --no-configuration-cache
